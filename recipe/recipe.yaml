schema_version: 1

context:
  version: "0.17.0"

package:
  name: dau-build
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dau-build/dau_build-${{ version }}.tar.gz
  sha256: c0b549c427e2e725675f3eb6898d465d45749efc7cd2f5a8f52aca5e22e422a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dau-build = dau_build.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - amaranth
    - artlink
    - ccflow >=0.8.5
    - dau-sim >=0.3
    - dau-utils
    - hydra-core
    - lerna >=2.0.4
    - omegaconf
    - pydantic
    - pyslang >=11
    - pyyaml
    - typing-extensions

tests:
  - python:
      imports:
        - dau_build
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - dau-build --help

about:
  summary: Build tools for dau
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dau-dev/dau-build
  repository: https://github.com/dau-dev/dau-build

extra:
  recipe-maintainers:
    - timkpaine
